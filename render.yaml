# Render Blueprint. Optional: lets you create the service automatically.
# In Render, click "New +" → "Blueprint" and point it at this repo.
# You will still need to fill in the secret environment variables
# (marked sync:false) in the Render dashboard afterwards.
services:
  - type: web
    name: rishiai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false   # set to your https://<name>.onrender.com URL
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AI_BASE_URL
        value: https://api.anthropic.com/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODELS
        value: claude-sonnet-4-6,claude-opus-5-5
      - key: AI_DEFAULT_MODEL
        value: claude-sonnet-4-6
      - key: AI_WORKSPACE_ID
        sync: false   # leave unset unless your Anthropic key needs it
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_MAX
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
