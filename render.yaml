# Render Blueprint — provisions the web service and a Postgres database.
# In Render: New + → Blueprint → pick this repo. It reads this file.
# You'll still paste the secret values (Google / Anthropic / Stripe) in the dashboard.

services:
  - type: web
    name: rishiai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true        # Render generates a strong random value
      - key: DATABASE_URL
        fromDatabase:
          name: rishiai-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false                 # set in dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COMP_MAX_EMAILS
        sync: false

databases:
  - name: rishiai-db
    plan: free
